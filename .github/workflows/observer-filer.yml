name: APEX observer filer

# The observer measures alpha.school in superbuilders/aeo. This workflow applies the
# playbook's ticket policy to the resulting packet. It is dry-run-only until both the
# three-run precision gate passes and OBSERVER_FILER_APPLY is explicitly set to true.
on:
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Exact successful superbuilders/aeo observer run (default: latest successful run)'
        required: false
      apply:
        description: 'Write to APEX (requires an exact run_id and merged APEX PR 409)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: apex-observer-filer
  cancel-in-progress: false

jobs:
  file:
    name: Apply playbook policy to observer packet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Select observer run and execution mode
        id: select
        env:
          GH_TOKEN: ${{ secrets.AEO_REPO_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          INPUT_APPLY: ${{ inputs.apply }}
          CONFIG_APPLY: ${{ vars.OBSERVER_FILER_APPLY }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'AEO_REPO_TOKEN is required to read the observer artifact.' >&2; exit 2; }

          run_id="$INPUT_RUN_ID"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh run list \
              --repo superbuilders/aeo \
              --workflow 'Alpha Website Production Observer' \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "No successful numeric observer run was found: $run_id" >&2; exit 2; }

          apply=false
          if [[ "$TRIGGER_EVENT" == 'schedule' && "$CONFIG_APPLY" == 'true' ]]; then apply=true; fi
          if [[ "$TRIGGER_EVENT" == 'workflow_dispatch' && "$INPUT_APPLY" == 'true' ]]; then apply=true; fi
          if [[ "$apply" == 'true' && -z "$INPUT_RUN_ID" ]]; then
            echo 'Apply mode requires an exact workflow_dispatch run_id; scheduled apply uses the selected successful run.' >&2
            if [[ "$TRIGGER_EVENT" == 'workflow_dispatch' ]]; then exit 2; fi
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "apply=$apply" >> "$GITHUB_OUTPUT"
          echo "Observer run: $run_id"
          echo "Mode: $([[ "$apply" == 'true' ]] && echo apply || echo dry-run)"

      - name: Require merged APEX filer support before writes
        if: steps.select.outputs.apply == 'true'
        env:
          GH_TOKEN: ${{ secrets.AEO_REPO_TOKEN }}
        run: |
          set -euo pipefail
          merged_at="$(gh api repos/trilogy-group/alpha-event-task-management/pulls/409 --jq '.merged_at // empty')"
          test -n "$merged_at" || {
            echo 'Refusing APEX writes: trilogy-group/alpha-event-task-management PR 409 is not merged.' >&2
            exit 2
          }

      - name: Download packet and build filer report
        env:
          GH_TOKEN: ${{ secrets.AEO_REPO_TOKEN }}
          APEX_API_TOKEN: ${{ secrets.APEX_API_TOKEN }}
          APEX_API_BASE: ${{ vars.APEX_API_BASE || 'https://apex.2hourlearning.com/api/v1' }}
          APEX_AGENT_API_BASE: ${{ vars.APEX_AGENT_API_BASE || 'https://apex.2hourlearning.com/api/agent' }}
          APEX_QC_REQUESTER_EMAIL: ${{ vars.APEX_QC_REQUESTER_EMAIL || 'matthew.barge@superbuilders.school' }}
          RUN_ID: ${{ steps.select.outputs.run_id }}
          APPLY: ${{ steps.select.outputs.apply }}
          PACKET_DIR: ${{ runner.temp }}/observer-packet
        run: |
          set -euo pipefail
          test -n "$APEX_API_TOKEN" || { echo 'APEX_API_TOKEN is required to read the open queue.' >&2; exit 2; }
          mkdir -p out
          args=(
            --run "$RUN_ID"
            --run-dir "$PACKET_DIR"
            --bundle spec/check-bundle.generated.json
            --report out/filer-report.json
          )
          if [[ "$APPLY" == 'true' ]]; then args+=(--apply); fi
          node agent/file-observer-findings.mjs "${args[@]}" | tee out/filer-summary.json
          if [[ -f "$PACKET_DIR/filer-writes.jsonl" ]]; then cp "$PACKET_DIR/filer-writes.jsonl" out/; fi

      - name: Summarize filer decision
        if: always() && hashFiles('out/filer-report.json') != ''
        run: |
          {
            echo '## APEX observer filer'
            echo
            jq -r '"- Mode: `\(.mode)`\n- Observer run: `\(.runId)`\n- Bundle: `\(.bundleVersion)` (`\(.bundleSha256)`)\n- Candidate tickets: **\(.counts.files)**\n- Existing/deduped: **\(.counts.existing)**\n- Held: **\(.counts.held)**\n- Suppressed: **\(.counts.suppressed)**\n- Loop-health only: **\(.counts.loopHealth)**\n- Candidate resolutions: **\(.counts.resolves)**\n- Invalid contracts: **\(.counts.invalid)**"' out/filer-report.json
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('out/**') != ''
        with:
          name: observer-filer-${{ steps.select.outputs.run_id }}-${{ github.run_id }}
          path: out/
          retention-days: 30

