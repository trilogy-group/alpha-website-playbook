name: APEX intake agent
# Runs the playbook intake agent on top of the APEX API. Dry-run unless the repository variable INTAKE_APPLY is "true".
# It validates, classifies, routes, and renders website-family tickets; it never edits a page.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'ISO time; only tickets updated after this (default: 40 minutes ago)'
        required: false
      apply:
        description: 'write to APEX (true/false); overrides INTAKE_APPLY for this run'
        required: false
        default: 'false'
concurrency:
  group: apex-intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run intake
        env:
          APEX_API_TOKEN: ${{ secrets.APEX_API_TOKEN }}
          APEX_API_BASE: ${{ vars.APEX_API_BASE || 'https://apex.2hourlearning.com/api/v1' }}
          HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY }}
        run: |
          SINCE="${{ github.event.inputs.since }}"
          if [ -z "$SINCE" ]; then SINCE=$(date -u -d '40 minutes ago' +%Y-%m-%dT%H:%M:%SZ); fi
          APPLY="${{ github.event.inputs.apply }}"
          if [ "$APPLY" != "true" ] && [ "${{ vars.INTAKE_APPLY }}" = "true" ] && [ "${{ github.event_name }}" = "schedule" ]; then APPLY=true; fi
          mkdir -p out
          if [ "$APPLY" = "true" ]; then node agent/intake.mjs --since "$SINCE" --apply --report out/intake.json; else node agent/intake.mjs --since "$SINCE" --report out/intake.json; fi
      - uses: actions/upload-artifact@v4
        with:
          name: intake-${{ github.run_id }}
          path: out/intake.json
          retention-days: 30
