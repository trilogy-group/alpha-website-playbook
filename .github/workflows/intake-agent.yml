name: APEX intake agent
# Runs the playbook intake agent on top of the APEX API. Dry-run unless the repository variable INTAKE_APPLY is "true".
# It classifies, checks completeness and policy, requests typed clarification, and routes website-family tickets.
# It administers APEX only; it never edits WordPress, HubSpot, n8n, or any other delivery system.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'ISO time; only tickets updated after this (default: 24 hours ago)'
        required: false
      apply:
        description: 'write to APEX (true/false); overrides INTAKE_APPLY for this run'
        required: false
        default: 'false'
      task_id:
        description: 'exact APEX task id; required for a manual apply canary'
        required: false
concurrency:
  group: apex-intake
  cancel-in-progress: false
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run intake
        env:
          APEX_API_TOKEN: ${{ secrets.APEX_API_TOKEN }}
          APEX_API_BASE: ${{ vars.APEX_API_BASE || 'https://apex.2hourlearning.com/api/v1' }}
          APEX_AGENT_API_BASE: ${{ vars.APEX_AGENT_API_BASE || 'https://apex.2hourlearning.com/api/agent' }}
          ALPHA_WP_BASE_URL: ${{ vars.ALPHA_WP_BASE_URL || 'https://alpha.school' }}
          ALPHA_WP_USERNAME: ${{ secrets.ALPHA_WP_USERNAME }}
          ALPHA_WP_APPLICATION_PASSWORD: ${{ secrets.ALPHA_WP_APPLICATION_PASSWORD }}
          INPUT_SINCE: ${{ github.event.inputs.since }}
          INPUT_APPLY: ${{ github.event.inputs.apply }}
          INPUT_TASK_ID: ${{ github.event.inputs.task_id }}
          CONFIG_INTAKE_APPLY: ${{ vars.INTAKE_APPLY }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          SINCE="$INPUT_SINCE"
          if [ -z "$SINCE" ]; then SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ); fi
          APPLY="$INPUT_APPLY"
          if [ "$APPLY" != "true" ] && [ "$CONFIG_INTAKE_APPLY" = "true" ] && [ "$TRIGGER_EVENT" = "schedule" ]; then APPLY=true; fi
          if [ "$TRIGGER_EVENT" = "workflow_dispatch" ] && [ "$APPLY" = "true" ] && [ -z "$INPUT_TASK_ID" ]; then
            echo 'Manual apply requires one exact task_id.' >&2
            exit 2
          fi
          TASK_ARGS=()
          if [ -n "$INPUT_TASK_ID" ]; then TASK_ARGS=(--ticket "$INPUT_TASK_ID"); fi
          mkdir -p out
          if [ "$APPLY" = "true" ]; then node agent/intake.mjs --since "$SINCE" "${TASK_ARGS[@]}" --apply --report out/intake.json; else node agent/intake.mjs --since "$SINCE" "${TASK_ARGS[@]}" --report out/intake.json; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intake-${{ github.run_id }}
          path: out/intake.json
          retention-days: 30
